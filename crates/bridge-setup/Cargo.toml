[package]
name = "bridge-setup"
version = "0.2.0-rc.1"
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }



